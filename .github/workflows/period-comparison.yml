name: PERIOD expanded comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - experiments/2026-11-07/COMPARISON_PROTOCOL.md
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case: [reorder_3, reorder_4, account, lazy01, twostage]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Paired comparison and predeclared diagnostic
        run: bash scripts/period_container_comparison.sh '${{ matrix.case }}' "$RUNNER_TEMP/period-study"
      - name: Preserve all evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: period-deep-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/period-study/
          if-no-files-found: error
          retention-days: 30
  archive:
    needs: comparison
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: period-deep-*-${{ github.run_id }}
          path: ${{ runner.temp }}/downloaded
      - name: Archive bounded evidence and exact bytes
        env:
          BATCH_RUN: ${{ github.run_id }}
          PROTOCOL_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'downloaded'
          dest=Path('results/2026-11-07')/('comparison-'+os.environ['BATCH_RUN'])
          if dest.exists(): raise SystemExit('Refuse to overwrite an existing batch')
          dest.mkdir(parents=True)
          counts={}
          for folder in sorted(source.iterdir()):
              prefix='period-deep-';suffix='-'+os.environ['BATCH_RUN']
              if not folder.name.startswith(prefix) or not folder.name.endswith(suffix): raise SystemExit('Unexpected artifact')
              case=folder.name[len(prefix):-len(suffix)]
              if case not in {'reorder_3','reorder_4','account','lazy01','twostage'}: raise SystemExit('Unexpected case')
              for p in folder.rglob('*'):
                  if p.is_symlink(): raise SystemExit('Reject symlink')
                  if not p.is_file(): continue
                  if p.stat().st_size>50000000: raise SystemExit('Oversized evidence')
                  target=dest/case/p.relative_to(folder);target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(p,target)
              index=dest/case/'records.json'
              counts[case]=len(json.loads(index.read_text())) if index.exists() else None
          files=[]
          for p in sorted(dest.rglob('*')):
              if p.is_file():
                  b=p.read_bytes();files.append({'path':p.relative_to(dest).as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (dest/'archive_manifest.json').write_text(json.dumps({'run_id':os.environ['BATCH_RUN'],'protocol_commit':os.environ['PROTOCOL_SHA'],'command_records':counts,'files':files},indent=2)+'\n')
          print(json.dumps({'directory':str(dest),'files':len(files),'record_counts':counts}))
          PY
          git add -- "results/2026-11-07/comparison-$GITHUB_RUN_ID"
          python3 scripts/check_repository.py --staged
          git diff --cached --check
      - name: Publish archive with preserved history
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m '[1240001201] 孙皓扬: archive expanded PERIOD comparison and replay evidence' -m 'Automated evidence publication requested by the repository owner. All attempts are retained; scientific interpretation and member review are separate. See docs/AI_USAGE.md.'
          AUTH=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
