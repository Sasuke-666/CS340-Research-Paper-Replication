name: Replay the archived twostage witness
on:
  push:
    branches: [review/1240000576-twostage-witness]
    paths:
      - '.github/workflows/twostage-witness-review.yml'
      - 'scripts/replay_twostage.sh'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Replay the fixed witness five times
        run: bash scripts/replay_twostage.sh "$RUNNER_TEMP/twostage-evidence"
      - name: Preserve setup and every replay outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: twostage-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/twostage-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Emit checksummed copy for the review record
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'twostage-evidence'
          for file in sorted(root.glob('*.txt')) + sorted(root.glob('*.exit')):
              raw = file.read_bytes()
              print('EVIDENCE_JSON ' + json.dumps([file.name, hashlib.sha256(raw).hexdigest(), base64.b64encode(gzip.compress(raw)).decode()]))
          PY
