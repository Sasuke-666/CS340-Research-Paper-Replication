name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test repository and experiment helpers
        run: python -m unittest discover -s tests -v
      - name: Check tracked repository files
        run: python scripts/check_repository.py
      - name: Verify archived experiment bytes and measurements
        run: python scripts/verify_period_evidence.py
      - name: Independently recount raw experiment records
        run: python scripts/audit_period_results.py
      - name: Audit comparison batches and published summaries
        run: make audit-comparisons PYTHON=python
      - name: Audit merged independent member evidence
        run: make audit-member PYTHON=python
      - name: Audit controlled layout evidence and published conclusions
        run: make audit-layout PYTHON=python
      - name: Build readable stage-report exports
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -r requirements-report.txt
          python scripts/export_stage_report.py
          python scripts/export_member_checklist.py
      - name: Package tracked source and evidence without Git metadata
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json,os,subprocess,zipfile
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          out=Path(os.environ['RUNNER_TEMP'])/'CS340_Progress_20261114.zip'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as bundle:
              for name in paths:
                  if not name: continue
                  p=Path(name)
                  if p.is_symlink() or not p.is_file(): raise SystemExit('Invalid tracked file')
                  bundle.write(p,name)
              for p in sorted(Path('report/export').glob('*')):
                  if p.suffix in {'.pdf','.docx'}: bundle.write(p,p.as_posix())
              bundle.writestr('SNAPSHOT.json',json.dumps({'commit':os.environ['GITHUB_SHA'],'scope':'Tracked source and archived evidence; Git history and credentials excluded'},indent=2)+'\n')
          print(out.name)
          PY
      - name: Preserve verified source snapshot
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cs340-stage-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/CS340_Progress_20261114.zip
          if-no-files-found: error
          retention-days: 30
