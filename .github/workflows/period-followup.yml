name: PERIOD controlled follow-up
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Controlled extension and replay
        env:
          PERIOD_DRIVER: run_period_followup.py
        run: bash scripts/period_container_pilot.sh "$RUNNER_TEMP/period-followup"
      - name: Preserve evidence without replacing the historical batch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: period-followup-${{ github.run_id }}
          path: ${{ runner.temp }}/period-followup/
          retention-days: 30
          if-no-files-found: error
